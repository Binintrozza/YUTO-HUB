<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUTO-HUB Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 0.5rem;
    }
    p {
      color: #8b949e;
      margin-top: 0;
    }
    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: #238636;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="status-badge">Live</span>
    <h1>YUTO-HUB is Running</h1>
    <p>GitHub Pages test successful.</p>
  </div>
</body>
</html>
